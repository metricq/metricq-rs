[package]
name = "metricq-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
derive_builder = "0.20.2"
derive_more = { version = "2.1.1", features = ["display", "from", "into"] }
lapin = "4.10.0"
protobuf = "3.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-executor-trait = "3.1.0"
tokio-reactor-trait = "4.1.1"
tokio-stream = { version = "0.1.19", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[build-dependencies]
protobuf-codegen = "3.7.2"
